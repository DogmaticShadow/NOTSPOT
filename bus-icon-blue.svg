<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Bus body -->
  <rect x="6" y="4" width="20" height="24" rx="2" ry="2" fill="#3498db" stroke="#333" stroke-width="1"/>
  
  <!-- Top section (roof) -->
  <rect x="8" y="2" width="16" height="4" rx="1" ry="1" fill="#666"/>
  
  <!-- Front windows -->
  <rect x="9" y="6" width="14" height="3" rx="1" ry="1" fill="#87ceeb" stroke="#333" stroke-width="0.5"/>
  
  <!-- Side windows -->
  <rect x="9" y="11" width="6" height="3" rx="1" ry="1" fill="#87ceeb" stroke="#333" stroke-width="0.5"/>
  <rect x="17" y="11" width="6" height="3" rx="1" ry="1" fill="#87ceeb" stroke="#333" stroke-width="0.5"/>
  
  <!-- Door -->
  <rect x="13" y="16" width="6" height="8" rx="1" ry="1" fill="#2980b9" stroke="#333" stroke-width="0.5"/>
  
  <!-- Door handle -->
  <circle cx="17" cy="20" r="0.5" fill="#333"/>
  
  <!-- Headlights -->
  <circle cx="10" cy="26" r="1.5" fill="#fff" stroke="#333" stroke-width="0.5"/>
  <circle cx="22" cy="26" r="1.5" fill="#fff" stroke="#333" stroke-width="0.5"/>
  
  <!-- Front bumper -->
  <rect x="7" y="28" width="18" height="2" rx="1" ry="1" fill="#333"/>
</svg>