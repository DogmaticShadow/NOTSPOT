<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notspot - Bus Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="notspot.css">
</head>
<body>
    <div id="map"></div>
    <div class="info-panel">
        <h2>Notspot</h2>
        <div class="route-info">
            <div class="route route-2">Route 2</div>
            <div class="route route-93">Route 93</div>
        </div>
        <div id="bus-count">Loading buses...</div>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="notspot.js"></script>
</body>
</html>
